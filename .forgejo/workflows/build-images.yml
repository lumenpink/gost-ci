name: Build and Publish Containers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rust:
    name: "Build & Push gost-ci-rust"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Push Kaniko
        uses: docker://gcr.io/kaniko-project/executor:debug
        with:
          entrypoint: /busybox/sh
          args: >-
            -c "if [ -z \"${{ secrets.GAMBI_2LP_IN_TOKEN }}\" ]; then echo 'ERRO [FAIL-FAST]: GAMBI_2LP_IN_TOKEN nao configurado' >&2; exit 1; fi &&
            mkdir -p /kaniko/.docker &&
            echo '{\"auths\":{\"gambi.2lp.in\":{\"auth\":\"'$(echo -n "lumen:${{ secrets.GAMBI_2LP_IN_TOKEN }}" | base64 | tr -d '\n')'\"}}}' > /kaniko/.docker/config.json &&
            /kaniko/executor --context=dir://images/rust --dockerfile=images/rust/Dockerfile --destination=gambi.2lp.in/lumen/gost-ci-rust:latest --destination=gambi.2lp.in/lumen/gost-ci-rust:1.99.1"

  build-cross:
