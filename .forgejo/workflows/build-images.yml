            /kaniko/executor --cache=true --cache-repo=gambi.2lp.in/lumen/kaniko-cache --cache-ttl=168h --build-arg http_proxy="http://172.17.0.1:3142" --build-arg HTTP_PROXY="http://172.17.0.1:3142" --context=dir://images/python --dockerfile=images/python/Dockerfile --destination=gambi.2lp.in/lumen/gost-ci-python:latest --destination=gambi.2lp.in/lumen/gost-ci-python:3.11"

  build-go:
    name: "Build & Push gost-ci-go"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qE '^(\.forgejo/|images/go/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhuma alteracao detectada em images/go/. Pulando build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push Kaniko
        if: steps.check.outputs.build == 'true'
        uses: docker://gcr.io/kaniko-project/executor:debug
        with:
          entrypoint: /busybox/sh
          args: >-
            -c "if [ -z \"${{ secrets.GAMBI_2LP_IN_TOKEN }}\" ]; then echo 'ERRO [FAIL-FAST]: GAMBI_2LP_IN_TOKEN nao configurado' >&2; exit 1; fi &&
            mkdir -p /kaniko/.docker &&
            echo '{\"auths\":{\"gambi.2lp.in\":{\"auth\":\"'$(echo -n "lumen:${{ secrets.GAMBI_2LP_IN_TOKEN }}" | base64 | tr -d '\n')'\"}}}' > /kaniko/.docker/config.json &&
            /kaniko/executor --cache=true --cache-repo=gambi.2lp.in/lumen/kaniko-cache --cache-ttl=168h --build-arg http_proxy="http://172.17.0.1:3142" --build-arg HTTP_PROXY="http://172.17.0.1:3142" --context=dir://images/go --dockerfile=images/go/Dockerfile --destination=gambi.2lp.in/lumen/gost-ci-go:latest --destination=gambi.2lp.in/lumen/gost-ci-go:1.24"
